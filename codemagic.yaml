workflows:
  ios-build:
    name: iOS Build (For Pgyer)
    instance_type: mac_mini_m4
    environment:
      vars:
        BUNDLE_ID: com.knotrix.WebViewApp
        TEAM_ID: 78N442WG7C
      xcode: "16.2"
      cocoapods: default
    scripts:
      - name: Build IPA for Pgyer
        script: |
          cd WebViewApp
          xcodebuild \
            -project WebViewApp.xcodeproj \
            -scheme WebViewApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/WebViewApp.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=$TEAM_ID \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            build

          xcodebuild \
            -exportArchive \
            -archivePath build/WebViewApp.xcarchive \
            -exportPath build/output \
            -exportOptionsPlist exportOptions.plist \
            clean

    artifacts:
      - build/output/**/*.ipa
