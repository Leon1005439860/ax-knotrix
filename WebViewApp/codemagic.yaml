workflows:
  ios-build:
    name: iOS Build & Upload
    instance_type: mac_mini_m4
    environment:
      vars:
        BUNDLE_ID: com.knotrix.WebViewApp
        TEAM_ID: YOUR_TEAM_ID
      xcode: "16.2"
      cocoapods: default
    scripts:
      - name: Set up provisioning profiles
        script: |
          # 你需要在 Codemagic 的 Environment Variables 中添加:
          # APP_STORE_CONNECT_API_KEY_ID
          # APP_STORE_CONNECT_API_KEY
          # APP_STORE_CONNECT_API_ISSUER_ID
          # PROVISIONING_PROFILES_BASE64
          
      - name: Build iOS app
        script: |
          xcodebuild \
            -project WebViewApp.xcodeproj \
            -scheme WebViewApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/WebViewApp.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=$TEAM_ID \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            build

      - name: Create IPA
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath build/WebViewApp.xcarchive \
            -exportPath build/output \
            -exportOptionsPlist exportOptions.plist \
            clean

    artifacts:
      - build/output/**/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_API_KEY_ID
        issuer_id: $APP_STORE_CONNECT_API_ISSUER_ID
        submit_information:
          submit_for_review: false
